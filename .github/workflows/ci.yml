name: CI

on:
  push:
    branches: [main, 'agent/**', 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
      - name: Go format check
        run: |
          echo "GOFMT_FILES:"
          gofmt -l .
          test -z "$(gofmt -l .)"
      - name: Go vet
        run: go vet ./...
      - name: Go tests
        run: go test ./...
      - name: Telegram race/security tests
        run: go test -race ./internal/telegram -run 'Test(Concurrent|UpdateOffset|HTMLSplit|SplitTelegramHTML|ParseUpdates|SetCommands)'
      - name: Static release driver and initialization tests
        run: go test -tags sqlite_modernc ./...
      - name: Initialization race tests
        run: go test -race -tags sqlite_modernc ./internal/bootstrap ./internal/config ./cmd/server
      - name: Go build
        run: go build ./...
  # Every release architecture is built here, not just amd64, so a 32-bit
  # regression (untyped constants that only fit a 64-bit int, asm that has no
  # 32-bit path, ...) fails a pull request instead of a release. The pure-Go
  # SQLite driver is used because cross-compiling cgo is not available here.
  cross-arch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goarch: amd64, goamd64: v1, label: linux-amd64 }
          - { goarch: arm64, label: linux-arm64 }
          - { goarch: arm, goarm: '7', label: linux-armv7 }
          - { goarch: arm, goarm: '6', label: linux-armv6 }
          - { goarch: '386', label: linux-386 }
          - { goarch: riscv64, label: linux-riscv64 }
          - { goarch: loong64, label: linux-loong64 }
          - { goarch: ppc64le, label: linux-ppc64le }
          - { goarch: s390x, label: linux-s390x }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
      - name: Build static panel (${{ matrix.label }})
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          GOAMD64: ${{ matrix.goamd64 }}
        run: go build -tags sqlite_modernc -trimpath -o "3m-ui-${{ matrix.label }}" ./cmd/server
      # vet type-checks the test files too, which is what catches 32-bit
      # overflows in test fixtures (the panel binary itself compiles fine).
      - name: Vet tests (${{ matrix.label }})
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          GOAMD64: ${{ matrix.goamd64 }}
        run: go vet -tags sqlite_modernc ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          set -euo pipefail
          if ! npm ci --no-audit --no-fund; then
            echo "::warning::npm ci failed (lock out of sync); falling back to npm install"
            npm install --no-audit --no-fund
          fi
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate POSIX shell scripts
        run: |
          set -eu
          for script in scripts/install.sh scripts/update.sh scripts/uninstall.sh scripts/3m-ui.sh scripts/3m-ui scripts/download-mihomo.sh scripts/build-release-bundle.sh; do
            sh -n "$script"
          done
      - name: Distribution and lifecycle regression tests
        run: python3 -m unittest discover -s scripts/tests -v
